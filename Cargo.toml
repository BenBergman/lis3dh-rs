[package]
name = "lis3dh"
description = "An embedded-hal driver for the LIS3DH accelerometer that implements the generic accelerometer trait"
version = "0.4.4"
license = "Apache-2.0 OR MIT"
authors = [
    "Benjamin Bergman <ben@benbergman.ca>",
    "Paul Sajna <sajattack@gmail.com>",
    "Jesse Braham <jesse@beta7.io>",
    "Folkert de Vries <folkert@folkertdev.nl>"
]
keywords = [
    "embedded-hal-driver",
    "accelerometer",
]
repository = "https://github.com/BenBergman/lis3dh-rs"
edition = "2018"

[lib]
doctest = false

[dependencies]
accelerometer = "~0.12"
embedded-hal = "1.0"
num_enum = { version = "~0.5", default-features = false }

[features]
cpx-examples = []

[[example]]
name = "cpx"
required-features = ["cpx-examples"]

[[example]]
name = "motion_wakeup"
required-features = ["cpx-examples"]

[target.thumbv6m-none-eabi.dev-dependencies]
circuit_playground_express = { version = "0.12", features = ["use_semihosting"] }
cortex-m-rt = "~0.7"
cortex-m-semihosting = "~0.3"
panic-halt = "~0.2"
